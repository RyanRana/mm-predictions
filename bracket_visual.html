<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 March Madness · Top 25 Brackets</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#f8f9fa;--brd:#dee2e6;--tx:#212529;--dm:#6c757d;--grn:#198754;--amb:#b8860b;--red:#dc3545;--cyn:#0d6efd;--blu:#0d6efd;--pur:#6f42c1;--diff:#fd7e14}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Mono',monospace;font-size:11px;min-width:960px}

.hdr{text-align:center;padding:14px 10px 6px;border-bottom:1px solid var(--brd)}
.hdr h1{font-family:'Bebas Neue';font-size:2rem;letter-spacing:3px;color:#0d6efd}
/* Tabs */
.tabs-wrap{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:2px solid var(--brd)}
.tabs-toggle{padding:6px 12px;margin:8px 12px 0;font-size:10px;cursor:pointer;border:1px solid var(--brd);border-radius:4px;background:var(--card);color:var(--tx);font-family:inherit}
.tabs-toggle:hover{border-color:var(--blu);color:var(--cyn)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px 8px;padding:10px 12px;background:var(--bg)}
.tabs-wrap.hidden .tabs{display:none}
.tabs-wrap.hidden .tabs-toggle{margin-bottom:8px}
.tab{padding:5px 8px;font-size:9px;cursor:pointer;border:1px solid var(--brd);border-radius:4px;color:var(--dm);transition:all .15s;user-select:none;text-align:center;background:var(--card)}
.tab:hover{color:var(--tx);border-color:var(--blu)}
.tab.active{border-color:var(--cyn);color:var(--cyn);background:rgba(13,110,253,0.06)}
.tab .rank{font-family:'Bebas Neue';font-size:1rem;color:inherit}
.tab .conf{font-size:9px;display:block;color:var(--dm)}
.tab.active .conf{color:var(--cyn)}
.tab .champ-tag{font-size:8px;padding:1px 4px;border-radius:3px;background:#fff3cd;color:#856404;display:inline-block;margin-top:1px}

/* Champion — centered hero */
/* Bracket — centered */
.bracket-wrap{width:100%;overflow-x:auto;padding:12px 0;background:var(--bg)}
.bracket{display:flex;align-items:center;padding:6px 8px;gap:0;margin:0 auto;justify-content:center;max-width:1400px}
.half{display:flex;flex:1}
.half.right{flex-direction:row-reverse}

.round-col{display:flex;flex-direction:column;justify-content:space-around;min-width:118px;max-width:130px;padding:0 2px}
.rlbl{font-size:7px;color:var(--dm);text-align:center;letter-spacing:1px;text-transform:uppercase;padding:2px 0;background:#fff;z-index:1}
.rname-lbl{font-family:'Bebas Neue';font-size:.75rem;color:var(--cyn);text-align:center;letter-spacing:1.5px;padding:1px 0}
.sep{border-top:1px solid var(--brd);margin:3px 0}

.game{background:var(--card);border:1px solid var(--brd);border-radius:4px;margin:2px 0;padding:2px 5px;transition:border-color .15s;position:relative}
.game:hover{border-color:var(--blu)}
.game.differs{border-color:var(--diff);background:rgba(245,158,11,.05)}
.tl{display:flex;align-items:center;gap:2px;padding:1.5px 0;line-height:1.2}
.sd{color:var(--dm);font-size:9px;min-width:14px;text-align:right;flex-shrink:0}
.tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.pr{color:var(--dm);font-size:9px;min-width:26px;text-align:right;flex-shrink:0}
.w .tn{color:var(--grn);font-weight:600}
.w .pr{color:var(--grn)}
.l{opacity:.42}
.upd .tn{color:var(--red);font-weight:600}
.upd .pr{color:var(--red)}
.differs-icon{position:absolute;top:-3px;right:-3px;width:7px;height:7px;background:var(--diff);border-radius:50%}

/* FF center — championship centered */
.ff-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:160px;gap:6px;padding:0 8px}
.ff-lbl{font-family:'Bebas Neue';font-size:.9rem;color:var(--amb);letter-spacing:2px;margin-top:2px}
.ff-center .game{min-width:148px;border-color:var(--brd);background:#fff}
.ff-center .game.differs{border-color:var(--diff)}
.champ-name{font-family:'Bebas Neue';font-size:1.5rem;color:#1a1a1a;letter-spacing:3px;margin-top:8px;text-align:center;font-weight:700}

</style>
</head>

function getPicks(b) {
  const picks = {};
  for (const [rn, rd] of Object.entries(b.regions)) {
    rd.rounds.forEach((rnd, ri) => rnd.forEach((g, gi) => { picks[`${rn}:${ri}:${gi}`] = g.pick; }));
  }
  b.final_four.forEach((g, gi) => { picks[`FF:0:${gi}`] = g.pick; });
  picks['Champ:0:0'] = b.championship.pick;
  return picks;
}

const RN = ['R64', 'R32', 'S16', 'E8'];
const REGION_ORDER = ['East', 'South', 'Midwest', 'West'];

const base = TOP10[0];
const basePicks = getPicks(base);
const diffSets = TOP10.map(b => {
  const bp = getPicks(b);
  const diffs = new Set();
  for (const k in basePicks) if (basePicks[k] !== bp[k]) diffs.add(k);
  return diffs;
});

// Render tabs
const tabsEl = document.getElementById('tabs');
TOP10.forEach((b, i) => {
  const t = document.createElement('div');
  t.className = 'tab' + (i === 0 ? ' active' : '');
  const diffCount = diffSets[i].size;
  const diffTxt = i === 0 ? '<span class="champ-tag">baseline</span>' : `<span style="color:var(--diff);font-size:9px">±${diffCount} game${diffCount>1?'s':''}</span>`;
  t.innerHTML = `<span class="rank">#${b.rank}</span> <span class="conf">${b.avg_game_confidence}% avg conf</span> ${diffTxt}`;
  t.onclick = () => selectBracket(i);
  tabsEl.appendChild(t);
});

let currentIdx = 0;
function selectBracket(idx) {
  currentIdx = idx;
  tabsEl.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  renderBracket(idx);
}

function renderBracket(idx) {
  const b = TOP10[idx];
  const diffs = diffSets[idx];
  const main = document.getElementById('main');

  // Champion row
  const champ = b.champion;
  const champProb = b.championship.pick === b.championship.team_a ? b.championship.prob_a : b.championship.prob_b;
  main.innerHTML = `<div class="bracket-wrap"><div class="bracket" id="bkt"></div></div>`;

  const bkt = document.getElementById('bkt');

  function teamLine(name, seed, prob, isW) {
    const isUpset = false; // we'll check later
    return `<div class="tl ${isW ? 'w' : 'l'}">
      <span class="sd">${seed}</span>
      <span class="tn">${name}</span>
      <span class="pr">${(prob*100|0)}%</span>
    </div>`;
  }

  function renderGame(g, key, diffs) {
    const aWins = g.pick === g.team_a;
    const isUpset = g.pick_seed > Math.min(g.seed_a, g.seed_b);
    const differs = diffs.has(key);
    const loserClass = isUpset ? 'upd' : '';
    return `<div class="game${differs ? ' differs' : ''}">
      ${differs ? '<div class="differs-icon"></div>' : ''}
      <div class="tl ${aWins ? 'w' : (isUpset && !aWins ? 'upd' : 'l')}">
        <span class="sd">${g.seed_a}</span>
        <span class="tn">${g.team_a}</span>
        <span class="pr">${(g.prob_a*100|0)}%</span>
      </div>
      <div class="tl ${!aWins ? 'w' : (isUpset && aWins ? 'upd' : 'l')}">
        <span class="sd">${g.seed_b}</span>
        <span class="tn">${g.team_b}</span>
        <span class="pr">${(g.prob_b*100|0)}%</span>
      </div>
    </div>`;
  }

  function buildHalfEl(regions) {
    const h = document.createElement('div');
    h.className = 'half' + (regions === REGION_ORDER.slice(2) ? ' right' : '');
    const r0 = b.regions[regions[0]], r1 = b.regions[regions[1]];
    for (let ri = 0; ri < 4; ri++) {
      const col = document.createElement('div');
      col.className = 'round-col';
      let html = `<div class="rlbl">${RN[ri]}</div>`;
      if (ri === 0) html += `<div class="rname-lbl">${regions[0]}</div>`;
      (r0.rounds[ri] || []).forEach((g, gi) => { html += renderGame(g, `${regions[0]}:${ri}:${gi}`, diffs); });
      html += `<div class="sep"></div>`;
      if (ri === 0) html += `<div class="rname-lbl">${regions[1]}</div>`;
      (r1.rounds[ri] || []).forEach((g, gi) => { html += renderGame(g, `${regions[1]}:${ri}:${gi}`, diffs); });
      col.innerHTML = html;
      h.appendChild(col);
    }
    return h;
  }

  const leftH = buildHalfEl(REGION_ORDER.slice(0, 2));
  const rightH = buildHalfEl(REGION_ORDER.slice(2));
  rightH.classList.add('right');

  // FF + Championship center
  const ff = document.createElement('div');
  ff.className = 'ff-center';
  let ffHtml = '<div class="ff-lbl">FINAL FOUR</div>';
  b.final_four.forEach((g, gi) => { ffHtml += renderGame(g, `FF:0:${gi}`, diffs); });
  ffHtml += '<div class="ff-lbl">CHAMPIONSHIP</div>';
  ffHtml += renderGame(b.championship, 'Champ:0:0', diffs);
  ffHtml += `<div class="champ-name">${b.champion.name}</div>`;
  ff.innerHTML = ffHtml;

  bkt.appendChild(leftH);
  bkt.appendChild(ff);
  bkt.appendChild(rightH);
}

selectBracket(0);

const tabsWrap = document.getElementById('tabsWrap');
const tabsToggle = document.getElementById('tabsToggle');
tabsToggle.addEventListener('click', function() {
  tabsWrap.classList.toggle('hidden');
  tabsToggle.textContent = tabsWrap.classList.contains('hidden') ? 'Show 25 brackets' : 'Hide 25 brackets';
});
</script>
</body>
</html>
